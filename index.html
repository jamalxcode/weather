<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Weather Globe</title>
<style>
  :root { --bg:#0b1020; --panel:#141b30; --line:#ffffff1a; --text:#e8ecf5; --muted:#8c97b3; --accent:#4da3ff; --ocean:#10203d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }

  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .tabs { display:flex; gap:6px; }
  .tabs button { background:#ffffff12; color:var(--text); border:1px solid transparent; padding:6px 12px; border-radius:8px; cursor:pointer; font:inherit; }
  .tabs button.on { background:var(--accent); color:#04101f; font-weight:600; }
  #status { color:var(--muted); font-size:12px; }
  #legend { margin-left:auto; width:min(300px, 100%); }
  #ltitle { font-size:12px; color:var(--muted); }
  #legend .bar { height:10px; border-radius:5px; margin:4px 0 2px; }
  #legend .ticks { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }

  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,2fr) minmax(0,3fr); }
  .pane { position:relative; min-height:0; overflow:hidden; }
  .pane + .pane { border-left:1px solid var(--line); }
  #globe { background:#000; }
  #map { display:flex; align-items:center; justify-content:center; padding:16px; }
  #map svg { width:100%; height:100%; display:block; }
  #map path.region { stroke:#0b102099; stroke-width:0.4; cursor:pointer; }
  #map path.region:hover { stroke:#fff; stroke-width:1.2; }
  .label { position:absolute; top:10px; left:12px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); pointer-events:none; z-index:1; }

  @media (max-width: 900px) {
    html,body { height:auto; }
    main { display:block; }
    #globe { height:70vw; min-height:320px; }
    #map { height:auto; aspect-ratio:2/1.1; padding:8px; }
    .pane + .pane { border-left:none; border-top:1px solid var(--line); }
    #legend { margin-left:0; }
  }

  .tip { font:13px/1.4 system-ui,sans-serif; background:#0b1020ee; color:#e8ecf5; padding:8px 10px; border-radius:8px; border:1px solid #ffffff22; }
  .tip b { font-size:14px; } .tip span { color:#8c97b3; }
  #maptip { position:fixed; pointer-events:none; z-index:10; display:none; }
</style>
</head>
<body>
<header>
  <h1>World Weather Globe</h1>
  <div class="tabs" id="tabs"></div>
  <div id="status">Loading…</div>
  <div id="legend"><div id="ltitle"></div><div class="bar" id="lbar"></div><div class="ticks" id="lticks"></div></div>
</header>
<main>
  <div class="pane" id="globe"><div class="label">Globe</div></div>
  <div class="pane" id="map"><div class="label">Flat map · equal-area</div></div>
</main>
<div class="tip" id="maptip"></div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.33.1/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
// world.json (region shapes + weather) is rebuilt every 30 minutes by a GitHub Action,
// so visitors never call the weather API themselves.
const IMG = 'https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/';
const RELOAD_MS = 30*60*1000;

const LAYERS = {
  temp: { label:'Temperature', unit:'°C', min:-30, max:45, key:'t',
          stops:[[-30,'#5b2a86'],[-15,'#2f4bd6'],[0,'#4da3ff'],[10,'#7fd6c2'],[20,'#f2e86b'],[30,'#f39b3a'],[38,'#d6331f'],[45,'#7a0a1e']] },
  hum:  { label:'Humidity', unit:'%', min:0, max:100, key:'h',
          stops:[[0,'#c9a46a'],[25,'#e8d8a0'],[50,'#9fd8b0'],[75,'#3fb0b8'],[100,'#1b4f9c']] },
  rain: { label:'Rain today', unit:' mm', min:0, max:30, key:'p',
          stops:[[0,'#d9c7a0'],[0.5,'#bfe3d0'],[3,'#74c0e0'],[10,'#3b82d6'],[20,'#4b3fc4'],[30,'#5a1d8f']] }
};
let layer = 'temp', globe, regions = [], mapPaths;

const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
function color(L, v, alpha) {
  if (v == null || isNaN(v)) return `rgba(60,70,100,${alpha*0.7})`;
  const s = L.stops; v = Math.max(s[0][0], Math.min(s[s.length-1][0], v));
  for (let i=1;i<s.length;i++) if (v <= s[i][0]) {
    const [a,ca]=s[i-1], [b,cb]=s[i], f=(v-a)/(b-a), A=hex(ca), B=hex(cb);
    return 'rgba(' + A.map((x,k)=>Math.round(x+(B[k]-x)*f)).join(',') + ',' + alpha + ')';
  }
}

function fmt(v,u,d=1){ return v==null ? 'n/a' : (+v).toFixed(d)+u; }
const tipHtml = d => `<b>${d.name}</b>${d.country?` <span>${d.country}</span>`:''}<br>
  Temp: ${fmt(d.t,'°C')}<br>Humidity: ${fmt(d.h,'%',0)}<br>Rain today: ${fmt(d.p,' mm')}`;

function setLayer(k) {
  layer = k; const L = LAYERS[k];
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  document.getElementById('ltitle').textContent = L.label + ' (' + L.unit.trim() + ')';
  document.getElementById('lbar').style.background = 'linear-gradient(90deg,' + L.stops.map(([v,c])=>c+' '+((v-L.min)/(L.max-L.min)*100)+'%').join(',') + ')';
  const t = [0,.25,.5,.75,1].map(f=>Math.round(L.min+(L.max-L.min)*f));
  document.getElementById('lticks').innerHTML = t.map(x=>`<span>${x}</span>`).join('');
  if (globe) globe.polygonCapColor(d => color(L, d[L.key], 0.72));
  if (mapPaths) mapPaths.attr('fill', d => color(L, d[L.key], 1));
}

// ---- flat map: Equal Earth keeps every region's true relative area ----
const tip = document.getElementById('maptip');
function drawMap() {
  const box = document.getElementById('map');
  d3.select(box).select('svg').remove();
  const W = 1000, H = 520;
  const proj = d3.geoEqualEarth().fitExtent([[4,4],[W-4,H-4]], {type:'Sphere'});
  const path = d3.geoPath(proj);
  const svg = d3.select(box).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio','xMidYMid meet');
  svg.append('path').datum({type:'Sphere'}).attr('d', path).attr('fill', 'var(--ocean)');
  svg.append('path').datum(d3.geoGraticule10()).attr('d', path).attr('fill','none').attr('stroke','#ffffff14').attr('stroke-width',0.5);
  // Natural Earth rings wind opposite to what d3 expects; rewind so polygons don't fill the whole sphere
  mapPaths = svg.append('g').selectAll('path').data(regions).join('path')
    .attr('class','region')
    .attr('d', d => path(rewind(d.geometry)))
    .on('mousemove', (e,d) => { tip.innerHTML = tipHtml(d); tip.style.display='block';
      const x = Math.min(e.clientX+14, innerWidth - tip.offsetWidth - 8); tip.style.left = x+'px'; tip.style.top = (e.clientY+14)+'px'; })
    .on('mouseleave', () => tip.style.display='none');
  setLayer(layer);
}
function rewind(g) {
  const fix = ring => d3.geoArea({type:'Polygon', coordinates:[ring]}) > 2*Math.PI ? ring.slice().reverse() : ring;
  const poly = p => p.map(fix);
  return g.type==='Polygon' ? {type:g.type, coordinates:poly(g.coordinates)} : {type:g.type, coordinates:g.coordinates.map(poly)};
}

async function loadData() {
  const r = await fetch('world.json', { cache:'no-cache' });
  if (!r.ok) throw new Error('weather data not available yet');
  const data = await r.json();
  regions = data.regions;
  globe.polygonsData(regions);
  drawMap();
  document.getElementById('status').textContent =
    `${regions.length} regions · updated ${new Date(data.updated).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} · Open-Meteo`;
}

(async () => {
  const tabs = document.getElementById('tabs');
  for (const [k,L] of Object.entries(LAYERS)) {
    const b = document.createElement('button'); b.textContent = L.label; b.dataset.k = k; b.onclick = () => setLayer(k); tabs.appendChild(b);
  }
  setLayer('temp');

  const gbox = document.getElementById('globe');
  globe = Globe()(gbox)
    .width(gbox.clientWidth).height(gbox.clientHeight)
    .backgroundImageUrl(IMG+'night-sky.png')
    .globeImageUrl(IMG+'earth-blue-marble.jpg')
    .bumpImageUrl(IMG+'earth-topology.png')
    .atmosphereColor('#4da3ff').atmosphereAltitude(0.15)
    .polygonGeoJsonGeometry(d=>d.geometry)
    .polygonAltitude(0.006)
    .polygonSideColor(()=>'rgba(0,0,0,0)')
    .polygonStrokeColor(()=>'#ffffff55')
    .polygonLabel(d => `<div class="tip">${tipHtml(d)}</div>`)
    .onPolygonHover(d => globe.polygonAltitude(p => p===d ? 0.02 : 0.006));
  globe.pointOfView({ lat:20, lng:60 }); // start over Africa/Asia, then spin through everywhere
  globe.controls().autoRotate = true; globe.controls().autoRotateSpeed = 0.4;
  gbox.addEventListener('pointerdown', ()=>globe.controls().autoRotate=false);
  // the camera's field of view is vertical, so pull back further when the pane is tall and narrow
  const fit = () => { const w=gbox.clientWidth, h=gbox.clientHeight; globe.width(w).height(h);
    globe.pointOfView({ altitude: 1.3 + 1.3*Math.max(1, h/w) }); };
  new ResizeObserver(fit).observe(gbox);

  try { await loadData(); }
  catch (e) { document.getElementById('status').textContent = 'Error: ' + e.message; console.error(e); }
  setInterval(() => loadData().catch(console.error), RELOAD_MS);
})();
</script>
</body>
</html>
