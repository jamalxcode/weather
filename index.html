<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Weather Globe</title>
<style>
  :root { --bg:#0b1020; --panel:#141b30cc; --text:#e8ecf5; --muted:#8c97b3; --accent:#4da3ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; overflow:hidden; }
  #globe { position:absolute; inset:0; }
  .panel { position:absolute; background:var(--panel); backdrop-filter:blur(8px); border:1px solid #ffffff1a; border-radius:12px; padding:12px 14px; }
  #top { top:16px; left:16px; }
  #top h1 { font-size:15px; margin:0 0 10px; font-weight:600; }
  .tabs { display:flex; gap:6px; }
  .tabs button { background:#ffffff12; color:var(--text); border:1px solid transparent; padding:6px 12px; border-radius:8px; cursor:pointer; font:inherit; }
  .tabs button.on { background:var(--accent); color:#04101f; font-weight:600; }
  #status { margin-top:8px; color:var(--muted); font-size:12px; }
  #legend { bottom:16px; left:16px; width:min(320px, calc(100vw - 32px)); }
  #legend .bar { height:12px; border-radius:6px; margin:6px 0 4px; }
  #legend .ticks { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
  .tip { font:13px/1.4 system-ui,sans-serif; background:#0b1020ee; color:#e8ecf5; padding:8px 10px; border-radius:8px; border:1px solid #ffffff22; }
  .tip b { font-size:14px; } .tip span { color:#8c97b3; }
</style>
</head>
<body>
<div id="globe"></div>
<div class="panel" id="top">
  <h1>World Weather Globe</h1>
  <div class="tabs" id="tabs"></div>
  <div id="status">Loading map…</div>
</div>
<div class="panel" id="legend"><div id="ltitle"></div><div class="bar" id="lbar"></div><div class="ticks" id="lticks"></div></div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.33.1/dist/globe.gl.min.js"></script>
<script>
const NE = 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/';
const SPLIT = new Set(['USA','CAN','RUS','CHN','BRA','AUS','IND','IDN','ZAF']); // large countries shown by state/province
const IMG = 'https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/';
const CHUNK = 50, CACHE_KEY = 'wwg-v1', CACHE_MS = 60*60*1000;

const LAYERS = {
  temp: { label:'Temperature', unit:'°C', min:-30, max:45, key:'t',
          stops:[[-30,'#5b2a86'],[-15,'#2f4bd6'],[0,'#4da3ff'],[10,'#7fd6c2'],[20,'#f2e86b'],[30,'#f39b3a'],[38,'#d6331f'],[45,'#7a0a1e']] },
  hum:  { label:'Humidity', unit:'%', min:0, max:100, key:'h',
          stops:[[0,'#c9a46a'],[25,'#e8d8a0'],[50,'#9fd8b0'],[75,'#3fb0b8'],[100,'#1b4f9c']] },
  rain: { label:'Rain today', unit:' mm', min:0, max:30, key:'r',
          stops:[[0,'#d9c7a0'],[0.5,'#bfe3d0'],[3,'#74c0e0'],[10,'#3b82d6'],[20,'#4b3fc4'],[30,'#5a1d8f']] }
};
let layer = 'temp', features = [], globe;

const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
function color(L, v) {
  if (v == null || isNaN(v)) return 'rgba(60,70,100,0.5)';
  const s = L.stops; v = Math.max(s[0][0], Math.min(s[s.length-1][0], v));
  for (let i=1;i<s.length;i++) if (v <= s[i][0]) {
    const [a,ca]=s[i-1], [b,cb]=s[i], f=(v-a)/(b-a), A=hex(ca), B=hex(cb);
    return 'rgba(' + A.map((x,k)=>Math.round(x+(B[k]-x)*f)).join(',') + ',0.72)';
  }
}

// area-weighted centroid of the largest polygon, used as the region's sample point
function repPoint(geom) {
  const polys = geom.type==='Polygon' ? [geom.coordinates] : geom.coordinates;
  let best=null, bestA=-1;
  for (const p of polys) { const a = Math.abs(ringArea(p[0])); if (a>bestA){bestA=a;best=p[0];} }
  let A=0,cx=0,cy=0;
  for (let i=0,n=best.length-1;i<n;i++) {
    const [x0,y0]=best[i],[x1,y1]=best[i+1], c=x0*y1-x1*y0; A+=c; cx+=(x0+x1)*c; cy+=(y0+y1)*c;
  }
  if (!A) return best[0].slice();
  return [cx/(3*A), cy/(3*A)];
}
function ringArea(r){ let a=0; for(let i=0;i<r.length-1;i++) a+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1]; return a/2; }

async function loadRegions() {
  const [c, s] = await Promise.all([fetch(NE+'ne_50m_admin_0_countries.geojson'), fetch(NE+'ne_50m_admin_1_states_provinces.geojson')].map(p=>p.then(r=>r.json())));
  const out = [];
  for (const f of c.features) {
    const iso = f.properties.ADM0_A3;
    if (SPLIT.has(iso) || f.properties.ADMIN==='Antarctica') continue;
    out.push({ geometry:f.geometry, name:f.properties.NAME, country:'' });
  }
  for (const f of s.features) {
    if (!SPLIT.has(f.properties.adm0_a3)) continue;
    out.push({ geometry:f.geometry, name:f.properties.name, country:f.properties.admin });
  }
  for (const r of out) { const [lon,lat]=repPoint(r.geometry); r.lat=+lat.toFixed(2); r.lon=+lon.toFixed(2); }
  return out;
}

async function loadWeather(regions) {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if (c && Date.now()-c.t < CACHE_MS && c.d.length===regions.length) return {data:c.d, at:c.t};
  } catch(e){}
  const data = [];
  for (let i=0;i<regions.length;i+=CHUNK) {
    const part = regions.slice(i,i+CHUNK);
    const url = 'https://api.open-meteo.com/v1/forecast?latitude='+part.map(r=>r.lat).join(',')+
      '&longitude='+part.map(r=>r.lon).join(',')+
      '&current=temperature_2m,relative_humidity_2m&daily=precipitation_sum&forecast_days=1&timezone=auto';
    let res;
    for (let tries=0;tries<3;tries++) {
      const r = await fetch(url);
      if (r.ok) { res = await r.json(); break; }
      await new Promise(z=>setTimeout(z,1500*(tries+1)));
    }
    if (!res) throw new Error('Weather API unavailable');
    for (const w of (Array.isArray(res)?res:[res])) data.push({ t:w.current?.temperature_2m, h:w.current?.relative_humidity_2m, r:w.daily?.precipitation_sum?.[0] });
    document.getElementById('status').textContent = `Fetching weather… ${Math.min(i+CHUNK,regions.length)}/${regions.length}`;
    await new Promise(z=>setTimeout(z,300));
  }
  const at = Date.now();
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({t:at,d:data})); } catch(e){}
  return {data, at};
}

function fmt(v,u,d=1){ return v==null ? 'n/a' : (+v).toFixed(d)+u; }

function setLayer(k) {
  layer = k; const L = LAYERS[k];
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  document.getElementById('ltitle').textContent = L.label + ' (' + L.unit.trim() + ')';
  document.getElementById('lbar').style.background = 'linear-gradient(90deg,' + L.stops.map(([v,c])=>c+' '+((v-L.min)/(L.max-L.min)*100)+'%').join(',') + ')';
  const t = [0,.25,.5,.75,1].map(f=>Math.round(L.min+(L.max-L.min)*f));
  document.getElementById('lticks').innerHTML = t.map(x=>`<span>${x}</span>`).join('');
  if (globe) globe.polygonCapColor(d => color(L, d[L.key]));
}

(async () => {
  const tabs = document.getElementById('tabs');
  for (const [k,L] of Object.entries(LAYERS)) {
    const b = document.createElement('button'); b.textContent = L.label; b.dataset.k = k; b.onclick = () => setLayer(k); tabs.appendChild(b);
  }
  setLayer('temp');
  try {
    const regions = await loadRegions();
    document.getElementById('status').textContent = `Fetching weather… 0/${regions.length}`;
    const {data, at} = await loadWeather(regions);
    regions.forEach((r,i)=>Object.assign(r, data[i]||{}));
    features = regions;

    globe = Globe()(document.getElementById('globe'))
      .width(innerWidth).height(innerHeight)
      .backgroundImageUrl(IMG+'night-sky.png')
      .globeImageUrl(IMG+'earth-blue-marble.jpg')
      .bumpImageUrl(IMG+'earth-topology.png')
      .atmosphereColor('#4da3ff').atmosphereAltitude(0.15)
      .polygonsData(features)
      .polygonGeoJsonGeometry(d=>d.geometry)
      .polygonAltitude(0.006)
      .polygonSideColor(()=>'rgba(0,0,0,0)')
      .polygonStrokeColor(()=>'#ffffff55')
      .polygonLabel(d => `<div class="tip"><b>${d.name}</b>${d.country?` <span>${d.country}</span>`:''}<br>
        Temp: ${fmt(d.t,'°C')}<br>Humidity: ${fmt(d.h,'%',0)}<br>Rain today: ${fmt(d.r,' mm')}</div>`)
      .onPolygonHover(d => globe.polygonAltitude(p => p===d ? 0.02 : 0.006));
    globe.pointOfView({ lat:20, lng:60, altitude:2.4 }); // start over Africa/Asia, then spin through everywhere
    globe.controls().autoRotate = true; globe.controls().autoRotateSpeed = 0.4;
    document.getElementById('globe').addEventListener('pointerdown', ()=>globe.controls().autoRotate=false);
    addEventListener('resize', ()=>globe.width(innerWidth).height(innerHeight));
    setLayer(layer);
    document.getElementById('status').textContent = `${features.length} regions · updated ${new Date(at).toLocaleTimeString()} · Open-Meteo`;
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
