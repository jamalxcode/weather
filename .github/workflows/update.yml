name: Update weather

on:
  # cron-job.org starts this every 30 minutes (workflow_dispatch). GitHub's own schedule is often
  # late or skipped, so it is only a backup; the script skips fetching if data is under 20 minutes old.
  schedule:
    - cron: '7,37 * * * *'   # off the busy top of the hour
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: update
        run: node scripts/update.mjs
      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # a separate job, as GitHub recommends; it also gives the uploaded artifact time to register
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
